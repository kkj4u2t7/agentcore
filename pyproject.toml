[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "makeless"
version = "0.1.0"
description = "A local-first computer operator for Windows."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Avinash" }
]
dynamic = ["dependencies"]


[project.urls]
Homepage = "https://github.com/kkj4u2t7/agentcore"
Repository = "https://github.com/kkj4u2t7/agentcore"


[project.scripts]
makeless = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }


[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "app*",
    "execution*",
    "memory*",
    "observability*",
    "security*",
    "tools*"
]